<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img">
  <title id="logo-title">Kosmoskopos</title>
  <!-- Watcher's lens: an aperture/eye formed around the world -->
  <path d="M8 50 Q50 16 92 50" stroke="#f4b740" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M8 50 Q50 84 92 50" stroke="#f4b740" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
  <!-- Outer sentinel ring -->
  <circle cx="50" cy="50" r="26" stroke="#f4b740" stroke-width="1" opacity="0.35"/>
  <!-- The world (iris) -->
  <circle cx="50" cy="50" r="18" stroke="#f4b740" stroke-width="2.2"/>
  <ellipse cx="50" cy="50" rx="18" ry="7" stroke="#f4b740" stroke-width="1.3" opacity="0.7"/>
  <line x1="32" y1="50" x2="68" y2="50" stroke="#f4b740" stroke-width="1.3" opacity="0.7"/>
  <line x1="50" y1="32" x2="50" y2="68" stroke="#f4b740" stroke-width="1.3" opacity="0.7"/>
  <!-- Watch-point / pupil -->
  <circle cx="50" cy="50" r="4.5" fill="#f4b740"/>
  <!-- Cardinal sentinel ticks -->
  <line x1="50" y1="6" x2="50" y2="13" stroke="#f4b740" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="87" x2="50" y2="94" stroke="#f4b740" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="50" x2="13" y2="50" stroke="#f4b740" stroke-width="2" stroke-linecap="round"/>
  <line x1="87" y1="50" x2="94" y2="50" stroke="#f4b740" stroke-width="2" stroke-linecap="round"/>
</svg>
