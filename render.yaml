# Kosmoskopos — Render blueprint (free web service serving the production build
# with its same-origin /api proxies). Secret keys are set in the Render dashboard
# (sync:false); all are FREE-tier with no billing.
services:
  - type: web
    name: kosmoskopos
    runtime: node
    plan: free
    # Build the production bundle at build time (the builder has far more memory
    # than the free instance) and serve it with `vite preview`. Running the Vite
    # dev server in production exceeded the 512MB free-tier limit and OOM-looped.
    buildCommand: npm install --omit=dev && npm run build
    startCommand: npm run preview
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.14.0
      - key: ANALYST_RATELIMIT_PER_MIN
        value: "15"
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
